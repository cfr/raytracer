name: perf
on: pull_request

permissions:
  contents: read

jobs:
  perf:
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ci
          load: true
          tags: aktis-ci:local
          cache-from: type=gha

      - name: counters and profile
        run: >
          docker run --rm -e GITHUB_BASE_REF -u "$(id -u):$(id -g)" -v "$PWD":/repo aktis-ci:local
          ci/perfstat.sh --callgrind --profile --base "$GITHUB_BASE_REF"
